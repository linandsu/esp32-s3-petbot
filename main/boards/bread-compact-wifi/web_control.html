<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小狗控制台</title>
<style>
:root{color-scheme:dark;--ink:#ecf5f1;--muted:#8ca39b;--line:#284039;--panel:#13231f;--panel2:#182d27;--mint:#72e6b1;--amber:#ffca72;--danger:#ff6b68;--blue:#72bce6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 5%,#214c3e 0,transparent 30%),linear-gradient(145deg,#08110f,#0d1916 55%,#07100e);color:var(--ink);font:15px/1.45 "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}.wrap{width:min(940px,100%);margin:auto;padding:22px 16px 38px}header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding:4px 2px 17px;margin-bottom:16px}h1{font-family:"STKaiti","KaiTi",serif;font-size:clamp(27px,5vw,42px);line-height:1;margin:0;letter-spacing:1px}h1 small{display:block;margin-top:8px;color:var(--muted);font:500 11px/1.2 "Microsoft YaHei",sans-serif;letter-spacing:3px}.conn{font-size:12px;color:var(--danger);white-space:nowrap}.conn.on{color:var(--mint)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.bay{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 16px 30px #0004}.bay::before{content:attr(data-no);position:absolute;right:12px;top:7px;font:700 34px/1 Georgia,serif;color:#72e6b112}.wide-bay{grid-column:span 2}.title{display:flex;align-items:center;gap:9px;margin:0 0 13px;color:#b8cdc5;font-size:12px;letter-spacing:2px}.title i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{min-height:42px;border:1px solid #345047;border-radius:11px;background:#1d342d;color:var(--ink);font:inherit;cursor:pointer;transition:.16s transform,.16s background,.16s border-color,.16s opacity}button:active{transform:scale(.96)}button:hover,button.active{background:#285244;border-color:#61c99c}button:disabled{opacity:.42;cursor:not-allowed}button.stop{background:#542d2d;border-color:#8a4747;color:#ffd7d5;font-weight:700}button.primary{background:#23684f;border-color:#56c795;font-weight:700}button.wide{grid-column:span 3}.light-controls{display:grid;grid-template-columns:150px 1fr;gap:16px;margin-bottom:14px}.color-well{position:relative;min-height:96px;border:1px solid #38564c;border-radius:14px;background:#0b1714;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}.color-well input{width:68px;height:48px;border:0;padding:0;background:none;cursor:pointer}.color-well span,.range-head{color:var(--muted);font-size:12px}.color-well.disabled{opacity:.42}.range-box{display:flex;flex-direction:column;justify-content:center}.range-head{display:flex;justify-content:space-between;margin-bottom:10px}.range-head b{color:var(--amber);font-size:14px}input[type=range]{width:100%;accent-color:var(--mint)}.effect-note{height:18px;margin:8px 0 0;color:var(--muted);font-size:11px}.row{display:flex;gap:9px;align-items:center;margin:8px 0}.row label{min-width:42px;color:var(--muted)}.row output{min-width:28px;color:var(--amber)}.status{font-size:12px;line-height:1.75;color:#b4c9c1;white-space:pre-line}.wake-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-2px 0 14px;padding:12px 14px;border:1px solid #2e5045;border-radius:13px;background:#0d1b17}.wake-now{font-size:12px;color:var(--muted)}.wake-now strong{display:block;margin-top:3px;color:var(--mint);font-size:20px;letter-spacing:1px}.wake-state{padding:5px 9px;border-radius:99px;background:#20372f;color:#a9c1b8;font-size:11px}.wake-threshold{margin:-2px 0 14px;padding:11px 13px;border:1px solid #2e5045;border-radius:13px;background:#10231d}.wake-threshold small{display:block;margin-top:2px;color:#718b81;font-size:10px}.wake-tabs{display:flex;gap:6px;margin-bottom:12px}.wake-tabs button{min-height:36px;padding:0 18px}.wake-pane{display:none}.wake-pane.show{display:block}.preset-list{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.form-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}.field{display:block;color:var(--muted);font-size:11px;letter-spacing:.5px}.field input{display:block;width:100%;height:43px;margin-top:6px;padding:0 12px;border:1px solid #35534a;border-radius:10px;outline:none;background:#0b1714;color:var(--ink);font:15px inherit}.field input:focus{border-color:var(--mint);box-shadow:0 0 0 3px #72e6b116}.wake-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.validation{min-height:18px;color:var(--muted);font-size:11px}.validation.bad{color:var(--danger)}.validation.good{color:var(--mint)}.save-wake{min-width:150px}.hint{color:#718b81;font-size:11px;text-align:center;margin:15px 0 0}.toast{position:fixed;left:50%;bottom:22px;z-index:20;transform:translate(-50%,20px);min-width:min(360px,calc(100vw - 32px));padding:12px 16px;border:1px solid #3e6257;border-radius:12px;background:#11231eeb;box-shadow:0 18px 50px #0008;color:var(--ink);text-align:center;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{border-color:#864845;color:#ffd0ce}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide-bay{grid-column:auto}.light-controls{grid-template-columns:105px 1fr}.buttons{gap:7px}button{font-size:14px}.preset-list{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.wake-foot{align-items:stretch;flex-direction:column}.save-wake{width:100%}}
</style>
<style>
html,body{max-width:100%;overflow-x:hidden}.wrap,.grid,.bay,.buttons,.range-box,.wake-head,.form-grid{min-width:0}.buttons{grid-template-columns:repeat(3,minmax(0,1fr))}.range-box,.wake-now{overflow-wrap:anywhere}@media(max-width:650px){header{align-items:flex-start;flex-direction:column;gap:12px}h1{max-width:100%}h1 small{overflow-wrap:anywhere}.light-controls{grid-template-columns:105px minmax(0,1fr)}}
</style>
</head>
<body><main class="wrap">
<header><h1>小狗控制台<small>LOCAL MOTION &amp; LIGHT LAB</small></h1><strong id="conn" class="conn">● 正在连接</strong></header>
<div class="grid">
<section class="bay" data-no="01"><h2 class="title"><i></i>动作控制</h2><div class="buttons" id="actions"><button data-a="walk">前进</button><button data-a="stand">站立</button><button data-a="walk_back">后退</button><button data-a="turn_left">左转</button><button data-a="sitdown">坐下</button><button data-a="turn_right">右转</button><button data-a="wave">挥手</button><button data-a="sleep">趴睡</button><button class="stop" data-a="stop">立即停止</button></div></section>
<section class="bay" data-no="02"><h2 class="title"><i></i>表情</h2><div class="buttons" id="emotions"><button data-e="neutral">平静</button><button data-e="listening">聆听</button><button data-e="happy">开心</button><button data-e="sad">难过</button><button data-e="angry">生气</button><button id="auto">恢复自动</button></div></section>
<section class="bay wide-bay" data-no="03"><h2 class="title"><i></i>实时灯光</h2><div class="light-controls"><label class="color-well" id="colorWell"><input id="color" type="color" value="#ffffff" aria-label="灯光颜色"><span id="colorText">#FFFFFF · 待应用</span></label><div class="range-box"><div class="range-head"><span>亮度 <small>选择灯效时应用</small></span><b id="bnum">180</b></div><input id="bright" type="range" min="0" max="255" value="180"><p class="effect-note" id="effectNote">选择颜色和亮度不会点亮；点击灯效后才会按当前设置亮起</p></div></div><div class="buttons" id="effects"><button data-e="color">常亮</button><button data-e="breathe">呼吸灯</button><button data-e="flash">闪烁</button><button data-e="flow">流水灯</button><button data-e="neon">霓虹灯</button><button data-e="rainbow">彩虹灯</button><button class="wide" data-e="off">关闭灯光</button></div></section>
<section class="bay" data-no="04"><h2 class="title"><i></i>设备</h2><div class="row"><label>音量</label><input id="volume" type="range" min="0" max="100" value="50"><output id="vnum">50</output></div><div class="buttons"><button id="wake">唤醒对话</button><button id="sleep">进入睡眠</button></div></section>
<section class="bay" data-no="05"><h2 class="title"><i></i>运行状态</h2><div class="status" id="status">正在读取设备状态……</div></section>
<section class="bay wide-bay" data-no="06"><h2 class="title"><i></i>唤醒词设置</h2>
  <div class="wake-head"><div class="wake-now">当前唤醒词<strong id="wakeNow">你好小智</strong></div><span class="wake-state" id="wakeState">预设 · 已生效</span></div>
  <div class="range-box wake-threshold"><div class="range-head"><span>检测阈值 <small id="wakeThresholdHint">预设词和自定义词共用；数值越低越容易唤醒</small></span><b id="wakeThresholdValue">0.63</b></div><input id="wakeThreshold" type="range" min="40" max="95" value="63"><p class="effect-note">降低会提升灵敏度并增加误唤醒概率；有效范围为 0.40 到 0.95。</p></div>
  <div class="wake-tabs"><button class="active" data-tab="preset">中文预设</button><button data-tab="custom">自定义中文</button></div>
  <div class="wake-pane show" id="presetPane"><div class="preset-list" id="presets"><button data-model="wn9_nihaoxiaozhi_tts">你好小智</button><button data-model="wn9_xiaoaitongxue">小爱同学</button><button data-model="wn9_hai1xiao3ou1_tts3">嗨小欧</button><button data-model="wn9_ni3hao3xiao3rui4_tts3">你好小瑞</button></div></div>
  <div class="wake-pane" id="customPane"><div class="form-grid"><label class="field">中文唤醒词<input id="wakeText" maxlength="8" placeholder="例如：你好小狗" autocomplete="off"></label><label class="field">识别拼音（可修正多音字）<input id="wakePinyin" placeholder="ni hao xiao gou" autocomplete="off" spellcheck="false"></label></div></div>
  <div class="wake-foot"><span class="validation" id="wakeValidation">选择预设词后保存，设备会自动重启生效</span><button class="primary save-wake" id="saveWake">保存并重启</button></div>
</section>
</div><p class="hint">仅限当前 Wi-Fi 局域网使用 · 本页面未设置密码，同一网络内的设备均可控制</p>
</main><div class="toast" id="toast"></div>
<script src="/vendor/pinyin-pro.min.js"></script>
<script>
let ws,id=1,lastStatus={},lampEditingUntil=0,lampInFlight=0,pendingLamp={},wakeMode='preset',selectedPreset='wn9_nihaoxiaozhi_tts',wakeRequest=0,wakeDraftDirty=false,wakeThreshold=.63,toastTimer=0;const $=s=>document.querySelector(s);
function send(command,args={}){if(!ws||ws.readyState!==1)return null;const request=id++;ws.send(JSON.stringify({id:request,command,args}));return request}
function rgbHex(l){return '#'+[l.r,l.g,l.b].map(v=>(v??0).toString(16).padStart(2,'0')).join('').toUpperCase()}
function toast(text,bad=false,hold=2600){const el=$('#toast');el.textContent=text;el.className='toast show'+(bad?' bad':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast',hold)}
function thresholdBounds(){return{min:.40,max:.95,def:.63}}
function syncWakeThreshold(clamp=true){const b=thresholdBounds();if(clamp&&(wakeThreshold<b.min||wakeThreshold>b.max))wakeThreshold=b.def;const slider=$('#wakeThreshold');slider.min=Math.round(b.min*100);slider.max=Math.round(b.max*100);slider.value=Math.round(wakeThreshold*100);$('#wakeThresholdValue').textContent=wakeThreshold.toFixed(2);$('#wakeThresholdHint').textContent='预设词和自定义词共用；数值越低越容易唤醒'}
function switchWakeTab(mode,dirty=false){wakeMode=mode;if(dirty)wakeDraftDirty=true;syncWakeThreshold();document.querySelectorAll('.wake-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===mode));$('#presetPane').classList.toggle('show',mode==='preset');$('#customPane').classList.toggle('show',mode==='custom');validateWake()}
function pinyinFor(text){if(!window.pinyinPro||!text)return '';const value=window.pinyinPro.pinyin(text,{toneType:'none',type:'array'});return Array.isArray(value)?value.join(' '):String(value).replace(/\s+/g,' ').trim()}
function validateWake(){const note=$('#wakeValidation'),save=$('#saveWake'),b=thresholdBounds();let good=wakeThreshold>=b.min&&wakeThreshold<=b.max,msg='';if(!good)msg=`检测阈值需在 ${b.min.toFixed(2)} 到 ${b.max.toFixed(2)} 之间`;else if(wakeMode==='preset'){good=!!selectedPreset;msg=good?'保存后设备会自动重启，约十几秒恢复连接':'请选择一个预设唤醒词'}else{const text=$('#wakeText').value.trim(),py=$('#wakePinyin').value.trim().toLowerCase().replace(/\s+/g,' ');const chars=[...text];const tokens=py?py.split(' '):[];if(!/^[\u3400-\u9fff]{2,8}$/.test(text)){good=false;msg='请输入 2 到 8 个纯中文汉字'}else if(tokens.length!==chars.length||tokens.some(x=>!/^[a-z]{1,6}$/.test(x))){good=false;msg='每个汉字需要一个拼音，使用小写字母并用空格分隔'}else msg='拼音会决定实际识别读音，多音字请在此处修正';}note.textContent=msg;note.className='validation '+(good?'good':'bad');save.disabled=!good||wakeRequest!==0;return good}
function render(s){lastStatus=s;$('#conn').className='conn on';$('#conn').textContent='● 已连接';const n=s.network||{},l=s.lamp||{},a=s.audio_speaker||{},w=s.wake_word||{},bt=s.battery||{};const battery=bt.voltage!=null?`\n电池：${bt.voltage.toFixed(2)}V（${bt.percent}% · ${bt.level||'-'}）`:'';$('#status').textContent=`状态：${s.device_state||'-'}\n动作：${s.dog_action||'-'}\n网络：${n.ssid||'-'}（${n.signal||'-'}）\n灯效：${l.effect||'-'}${battery}\n地址：${s.control_url||location.href}`;if(a.volume!=null&&document.activeElement!==$('#volume')){$('#volume').value=a.volume;$('#vnum').textContent=a.volume}if(Date.now()>lampEditingUntil){if(l.r!=null){$('#color').value=rgbHex(l);$('#colorText').textContent=rgbHex(l)+' · 实时'}if(l.brightness!=null){$('#bright').value=l.brightness;$('#bnum').textContent=l.brightness}}document.querySelectorAll('#effects [data-e]').forEach(b=>b.classList.toggle('active',b.dataset.e===l.effect));const rainbow=l.effect==='rainbow';$('#color').disabled=rainbow;$('#colorWell').classList.toggle('disabled',rainbow);$('#effectNote').textContent=rainbow?'彩虹灯自动变色，亮度仍可实时调节':'选色会立即作用于当前灯效';if(w.display_text&&!wakeDraftDirty){$('#wakeNow').textContent=w.display_text;$('#wakeState').textContent=(w.mode==='custom'?'自定义':'预设')+(w.fallback?' · 已安全回退':' · 已生效');if(w.fallback&&w.fallback_reason)toast('唤醒词已回退：'+w.fallback_reason,true,5000);if(wakeRequest===0){selectedPreset=w.preset_model||selectedPreset;switchWakeTab(w.mode==='custom'?'custom':'preset');document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('active',b.dataset.model===selectedPreset));$('#wakeText').value=w.mode==='custom'?w.display_text:'';$('#wakePinyin').value=w.mode==='custom'?w.command_pinyin:'';}}}
function syncRemoteState(s){const w=s.wake_word||{},l=s.lamp||{};if(w.display_text&&wakeRequest===0&&!wakeDraftDirty&&Number.isFinite(+w.threshold)){wakeThreshold=+w.threshold;syncWakeThreshold(false)}if(!lampDraftDirty&&l.r!=null){$('#colorText').textContent=rgbHex(l)+' · 待应用'}const rainbow=l.effect==='rainbow';$('#effectNote').textContent=rainbow?'彩虹灯自动变色，颜色设置会保留给下次非彩虹灯效':'选择颜色和亮度不会点亮；点击灯效后才会按当前设置亮起'}
function flushLamp(){if(lampInFlight||!Object.keys(pendingLamp).length||!ws||ws.readyState!==1)return;const args=pendingLamp;pendingLamp={};lampInFlight=id++;ws.send(JSON.stringify({id:lampInFlight,command:'lamp.update',args}))}
function queueLamp(values){Object.assign(pendingLamp,values);flushLamp()}
function connect(){ws=new WebSocket(`ws://${location.host}/api/ws`);ws.onopen=flushLamp;ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'){render(m.payload);syncRemoteState(m.payload)}if(m.type==='result'){if(m.id===lampInFlight){lampInFlight=0;flushLamp()}if(m.id===wakeRequest){wakeRequest=0;if(m.ok&&m.restart_required){wakeDraftDirty=false;let left=Math.ceil((m.restart_in_ms||3000)/1000);toast(`设置已保存，${left} 秒后重启…`,false,5000);const timer=setInterval(()=>{left--;if(left>0)toast(`设置已保存，${left} 秒后重启…`,false,5000);else clearInterval(timer)},1000)}else if(!m.ok)toast(m.error||'唤醒词保存失败',true,5000);validateWake()}}};ws.onclose=()=>{lampInFlight=0;wakeRequest=0;validateWake();$('#conn').className='conn';$('#conn').textContent='● 连接断开，正在重连';setTimeout(connect,1500)}}
connect();$('#actions').onclick=e=>e.target.dataset.a&&send('dog.action',{action:e.target.dataset.a});$('#emotions').onclick=e=>e.target.dataset.e&&send('emotion.set',{emotion:e.target.dataset.e});$('#effects').onclick=e=>e.target.dataset.e&&send('lamp.effect',{effect:e.target.dataset.e});$('#color').oninput=e=>{lampEditingUntil=Date.now()+600;const x=e.target.value;$('#colorText').textContent=x.toUpperCase()+' · 实时';queueLamp({r:parseInt(x.slice(1,3),16),g:parseInt(x.slice(3,5),16),b:parseInt(x.slice(5,7),16)})};$('#bright').oninput=e=>{lampEditingUntil=Date.now()+600;$('#bnum').textContent=e.target.value;queueLamp({brightness:+e.target.value})};$('#auto').onclick=()=>send('emotion.auto');$('#wake').onclick=()=>send('device.wake');$('#sleep').onclick=()=>send('device.sleep');$('#volume').oninput=e=>$('#vnum').textContent=e.target.value;$('#volume').onchange=e=>send('volume.set',{volume:+e.target.value});document.querySelectorAll('.wake-tabs button').forEach(b=>b.onclick=()=>switchWakeTab(b.dataset.tab,true));$('#presets').onclick=e=>{if(!e.target.dataset.model)return;wakeDraftDirty=true;selectedPreset=e.target.dataset.model;document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('active',b===e.target));validateWake()};$('#wakeText').oninput=e=>{wakeDraftDirty=true;$('#wakePinyin').value=pinyinFor(e.target.value.trim());validateWake()};$('#wakePinyin').oninput=()=>{wakeDraftDirty=true;validateWake()};$('#saveWake').onclick=()=>{if(!validateWake()||wakeRequest)return;const args=wakeMode==='preset'?{mode:'preset',preset_model:selectedPreset}:{mode:'custom',display_text:$('#wakeText').value.trim(),command_pinyin:$('#wakePinyin').value.trim().toLowerCase().replace(/\s+/g,' ')};wakeRequest=send('wake_word.set',args);if(wakeRequest===null){toast('控制台尚未连接，未发送保存请求',true,5000);wakeRequest=0;validateWake();return}validateWake();toast('正在校验并保存唤醒词…')};validateWake();
</script>
<script>
$('#wakeThreshold').oninput=e=>{wakeDraftDirty=true;wakeThreshold=+e.target.value/100;syncWakeThreshold(false);validateWake()};
$('#saveWake').onclick=()=>{if(!validateWake()||wakeRequest)return;const args=wakeMode==='preset'?{mode:'preset',preset_model:selectedPreset,threshold:wakeThreshold}:{mode:'custom',display_text:$('#wakeText').value.trim(),command_pinyin:$('#wakePinyin').value.trim().toLowerCase().replace(/\s+/g,' '),threshold:wakeThreshold};wakeRequest=send('wake_word.set',args);if(wakeRequest===null){toast('控制台尚未连接，未发送保存请求',true,5000);wakeRequest=0;validateWake();return}validateWake();toast('正在校验并保存唤醒词…')};
syncWakeThreshold(false);validateWake();
</script>
<script>
var lampDraftDirty=false;
function currentLampDraft(){const x=$('#color').value;return{r:parseInt(x.slice(1,3),16),g:parseInt(x.slice(3,5),16),b:parseInt(x.slice(5,7),16),brightness:+$('#bright').value}}
$('#color').oninput=e=>{lampDraftDirty=true;lampEditingUntil=Number.MAX_SAFE_INTEGER;$('#colorText').textContent=e.target.value.toUpperCase()+' · 待应用'};
$('#bright').oninput=e=>{lampDraftDirty=true;lampEditingUntil=Number.MAX_SAFE_INTEGER;$('#bnum').textContent=e.target.value};
$('#effects').onclick=e=>{const effect=e.target.dataset.e;if(!effect)return;if(effect==='off'){lampDraftDirty=false;lampEditingUntil=0;send('lamp.effect',{effect:'off'});return}const lamp=currentLampDraft();lampDraftDirty=false;lampEditingUntil=0;send('lamp.configure',{effect,...lamp})};
</script></body></html>
