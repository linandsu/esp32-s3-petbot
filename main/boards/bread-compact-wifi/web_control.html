<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小狗控制台</title>
<style>
:root{color-scheme:dark;--ink:#ecf5f1;--muted:#8ca39b;--line:#284039;--panel:#13231f;--panel2:#182d27;--mint:#72e6b1;--amber:#ffca72;--danger:#ff6b68}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 5%,#214c3e 0,transparent 30%),linear-gradient(145deg,#08110f,#0d1916 55%,#07100e);color:var(--ink);font:15px/1.45 "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}.wrap{width:min(900px,100%);margin:auto;padding:22px 16px 38px}header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding:4px 2px 17px;margin-bottom:16px}h1{font-size:clamp(24px,5vw,38px);line-height:1;margin:0;letter-spacing:-1px}h1 small{display:block;margin-top:8px;color:var(--muted);font-size:11px;letter-spacing:3px;font-weight:500}.conn{font-size:12px;color:var(--danger);white-space:nowrap}.conn.on{color:var(--mint)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.bay{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 16px 30px #0004}.bay::before{content:attr(data-no);position:absolute;right:12px;top:7px;font:700 34px/1 Georgia,serif;color:#72e6b112}.lamp-bay{grid-column:span 2}.title{display:flex;align-items:center;gap:9px;margin:0 0 13px;color:#b8cdc5;font-size:12px;letter-spacing:2px}.title i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{min-height:42px;border:1px solid #345047;border-radius:11px;background:#1d342d;color:var(--ink);font:inherit;cursor:pointer;transition:.16s transform,.16s background,.16s border-color}button:active{transform:scale(.96)}button:hover,button.active{background:#285244;border-color:#61c99c}button.stop{background:#542d2d;border-color:#8a4747;color:#ffd7d5;font-weight:700}button.wide{grid-column:span 3}.light-controls{display:grid;grid-template-columns:150px 1fr;gap:16px;margin-bottom:14px}.color-well{position:relative;min-height:96px;border:1px solid #38564c;border-radius:14px;background:#0b1714;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}.color-well input{width:68px;height:48px;border:0;padding:0;background:none;cursor:pointer}.color-well span,.range-head{color:var(--muted);font-size:12px}.color-well.disabled{opacity:.42}.range-box{display:flex;flex-direction:column;justify-content:center}.range-head{display:flex;justify-content:space-between;margin-bottom:10px}.range-head b{color:var(--amber);font-size:14px}input[type=range]{width:100%;accent-color:var(--mint)}.effect-note{height:18px;margin:8px 0 0;color:var(--muted);font-size:11px}.row{display:flex;gap:9px;align-items:center;margin:8px 0}.row label{min-width:42px;color:var(--muted)}.row output{min-width:28px;color:var(--amber)}.status{font-size:12px;line-height:1.75;color:#b4c9c1;white-space:pre-line}.hint{color:#718b81;font-size:11px;text-align:center;margin:15px 0 0}@media(max-width:620px){.grid{grid-template-columns:1fr}.lamp-bay{grid-column:auto}.light-controls{grid-template-columns:105px 1fr}.buttons{gap:7px}button{font-size:14px}}
</style>
</head>
<body><main class="wrap">
<header><h1>小狗控制台<small>LOCAL MOTION & LIGHT LAB</small></h1><strong id="conn" class="conn">● 正在连接</strong></header>
<div class="grid">
<section class="bay" data-no="01"><h2 class="title"><i></i>动作控制</h2><div class="buttons" id="actions"><button data-a="walk">前进</button><button data-a="stand">站立</button><button data-a="walk_back">后退</button><button data-a="turn_left">左转</button><button data-a="sitdown">坐下</button><button data-a="turn_right">右转</button><button data-a="wave">挥手</button><button data-a="sleep">趴睡</button><button class="stop" data-a="stop">立即停止</button></div></section>
<section class="bay" data-no="02"><h2 class="title"><i></i>表情</h2><div class="buttons" id="emotions"><button data-e="neutral">平静</button><button data-e="listening">聆听</button><button data-e="happy">开心</button><button data-e="sad">难过</button><button data-e="angry">生气</button><button id="auto">恢复自动</button></div></section>
<section class="bay lamp-bay" data-no="03"><h2 class="title"><i></i>实时灯光</h2><div class="light-controls"><label class="color-well" id="colorWell"><input id="color" type="color" value="#ffffff" aria-label="灯光颜色"><span id="colorText">#FFFFFF · 实时</span></label><div class="range-box"><div class="range-head"><span>亮度 · 拖动实时生效</span><b id="bnum">255</b></div><input id="bright" type="range" min="0" max="255" value="255"><p class="effect-note" id="effectNote">选色会立即作用于当前灯效</p></div></div><div class="buttons" id="effects"><button data-e="color">常亮</button><button data-e="breathe">呼吸灯</button><button data-e="flash">闪烁</button><button data-e="flow">流水灯</button><button data-e="neon">霓虹灯</button><button data-e="rainbow">彩虹灯</button><button class="wide" data-e="off">关闭灯光</button></div></section>
<section class="bay" data-no="04"><h2 class="title"><i></i>设备</h2><div class="row"><label>音量</label><input id="volume" type="range" min="0" max="100" value="50"><output id="vnum">50</output></div><div class="buttons"><button id="wake">唤醒对话</button><button id="sleep">进入睡眠</button></div></section>
<section class="bay" data-no="05"><h2 class="title"><i></i>运行状态</h2><div class="status" id="status">正在读取设备状态……</div></section>
</div><p class="hint">仅限当前 Wi-Fi 局域网使用 · 动作执行时请保持小狗周围安全</p>
</main>
<script>
let ws,id=1,lastStatus={},lampEditingUntil=0,lampInFlight=0,pendingLamp={};const $=s=>document.querySelector(s);
function send(command,args={}){if(ws&&ws.readyState===1)ws.send(JSON.stringify({id:id++,command,args}))}
function rgbHex(l){return '#'+[l.r,l.g,l.b].map(v=>(v??0).toString(16).padStart(2,'0')).join('').toUpperCase()}
function render(s){lastStatus=s;$('#conn').className='conn on';$('#conn').textContent='● 已连接';const n=s.network||{},l=s.lamp||{},a=s.audio_speaker||{};$('#status').textContent=`状态：${s.device_state||'-'}\n动作：${s.dog_action||'-'}\n网络：${n.ssid||'-'}（${n.signal||'-'}）\n灯效：${l.effect||'-'}\n地址：${s.control_url||location.href}`;if(a.volume!=null&&document.activeElement!==$('#volume')){$('#volume').value=a.volume;$('#vnum').textContent=a.volume}if(Date.now()>lampEditingUntil){if(l.r!=null){$('#color').value=rgbHex(l);$('#colorText').textContent=rgbHex(l)+' · 实时'}if(l.brightness!=null){$('#bright').value=l.brightness;$('#bnum').textContent=l.brightness}}document.querySelectorAll('#effects [data-e]').forEach(b=>b.classList.toggle('active',b.dataset.e===l.effect));const rainbow=l.effect==='rainbow';$('#color').disabled=rainbow;$('#colorWell').classList.toggle('disabled',rainbow);$('#effectNote').textContent=rainbow?'彩虹灯自动变色，亮度仍可实时调节':'选色会立即作用于当前灯效'}
function flushLamp(){if(lampInFlight||!Object.keys(pendingLamp).length||!ws||ws.readyState!==1)return;const args=pendingLamp;pendingLamp={};lampInFlight=id++;ws.send(JSON.stringify({id:lampInFlight,command:'lamp.update',args}))}
function queueLamp(values){Object.assign(pendingLamp,values);flushLamp()}
function connect(){ws=new WebSocket(`ws://${location.host}/api/ws`);ws.onopen=flushLamp;ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state')render(m.payload);if(m.type==='result'&&m.id===lampInFlight){lampInFlight=0;flushLamp()}};ws.onclose=()=>{lampInFlight=0;$('#conn').className='conn';$('#conn').textContent='● 连接断开，正在重连';setTimeout(connect,1500)}}
connect();$('#actions').onclick=e=>e.target.dataset.a&&send('dog.action',{action:e.target.dataset.a});$('#emotions').onclick=e=>e.target.dataset.e&&send('emotion.set',{emotion:e.target.dataset.e});$('#effects').onclick=e=>e.target.dataset.e&&send('lamp.effect',{effect:e.target.dataset.e});$('#color').oninput=e=>{lampEditingUntil=Date.now()+600;const x=e.target.value;$('#colorText').textContent=x.toUpperCase()+' · 实时';queueLamp({r:parseInt(x.slice(1,3),16),g:parseInt(x.slice(3,5),16),b:parseInt(x.slice(5,7),16)})};$('#bright').oninput=e=>{lampEditingUntil=Date.now()+600;$('#bnum').textContent=e.target.value;queueLamp({brightness:+e.target.value})};$('#auto').onclick=()=>send('emotion.auto');$('#wake').onclick=()=>send('device.wake');$('#sleep').onclick=()=>send('device.sleep');$('#volume').oninput=e=>$('#vnum').textContent=e.target.value;$('#volume').onchange=e=>send('volume.set',{volume:+e.target.value});
</script></body></html>
